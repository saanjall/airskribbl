services:
  - type: web
    name: airskribbl
    runtime: node
    plan: free
    # --include=dev: Vite is a dev dependency, and hosts install production-only by default.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: GEMINI_API_KEY
        sync: false
